<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Four local contexts - Nourish and Flourish</title>
  <link rel="stylesheet" href="../assets/styles.css" />
  <style>
    body { background: #fff; }
    .viz-page { padding: 0.9rem 1.1rem; max-width: 1100px; margin: 0 auto; }

    /* 2x2 of context cards, framed by axis labels. The grid layout mirrors the
       Panel 4 scatter plot so the four contexts sit in the SAME corners:
       freshwater stress runs low -> high left to right; net food trade runs
       importer (top) -> exporter (bottom). */
    .matrix {
      display: grid;
      grid-template-columns: 1.8rem minmax(0,1fr) minmax(0,1fr);
      grid-template-rows: 1.6rem auto auto;
      gap: 0.8rem;
      align-items: stretch;
    }
    /* Column (stress) headers across the top */
    .axis-x {
      grid-row: 1;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.86rem; text-transform: uppercase; letter-spacing: 0.07em;
      font-weight: 700; color: var(--c-muted);
      font-family: "Open Sans", system-ui, sans-serif;
    }
    .axis-x.low  { grid-column: 2; }
    .axis-x.high { grid-column: 3; }
    /* Row (trade) labels down the left, rotated to read bottom-up */
    .axis-y {
      display: flex; align-items: center; justify-content: center;
      writing-mode: vertical-rl; transform: rotate(180deg);
      font-size: 0.86rem; text-transform: uppercase; letter-spacing: 0.07em;
      font-weight: 700; color: var(--c-muted);
      font-family: "Open Sans", system-ui, sans-serif;
    }
    .axis-y.imp { grid-column: 1; grid-row: 2; }
    .axis-y.exp { grid-column: 1; grid-row: 3; }

    .card {
      background: #fff;
      border: 1px solid var(--c-border);
      border-radius: 13px;
      padding: 1.4rem 1.5rem 1.5rem;
      position: relative;
      box-shadow: 0 2px 10px rgba(15, 79, 120, 0.06);
      display: flex; flex-direction: column; justify-content: center;
      min-width: 0; min-height: 230px; overflow: hidden;
    }
    .card::before {
      content: ""; position: absolute; top: 0; left: 0;
      width: 100%; height: 4px; background: var(--accent);
    }
    /* grid placement */
    .c1 { grid-column: 2; grid-row: 2; }
    .c4 { grid-column: 3; grid-row: 2; }
    .c2 { grid-column: 2; grid-row: 3; }
    .c3 { grid-column: 3; grid-row: 3; }

    .card-num {
      font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.09em;
      font-weight: 700; margin: 0 0 0.35rem; color: var(--accent);
      font-family: "Open Sans", system-ui, sans-serif;
    }
    .card-title {
      font-size: 1.42rem; font-weight: 700; margin: 0 0 1rem;
      color: var(--c-text); line-height: 1.2;
    }

    /* Icon meters: a labelled row of drops (water) and a row of crops (food).
       Filled glyphs encode availability/output; faded glyphs are the empty
       slots, so "surplus" reads as a full row and "deficit" as a near-empty
       one - the same message as Natasha's infographic, in our house style. */
    .meter { display: flex; align-items: center; gap: 0.6rem; margin: 0.35rem 0; }
    .meter .m-label {
      width: 4rem; flex: none; font-size: 0.92rem; font-weight: 600;
      color: var(--c-muted); font-family: "Open Sans", system-ui, sans-serif;
    }
    .meter .glyphs { display: flex; gap: 0.3rem; }
    .meter svg { width: 26px; height: 32px; display: block; }
    .glyph-empty { opacity: 0.2; }

    .card-foot {
      margin-top: 1rem; font-size: 1rem; line-height: 1.4;
      color: var(--c-text); font-style: italic;
    }

    .footer-note {
      font-size: 0.72rem; color: var(--c-muted);
      margin-top: 0.8rem; padding-top: 0.55rem;
      border-top: 1px solid var(--c-border); line-height: 1.4;
    }
    body[data-embed="storymap"] .back-link { display: none; }
    body[data-embed="storymap"] { margin: 0; }
    body[data-embed="storymap"] .viz-page {
      min-height: 100vh; box-sizing: border-box;
      display: flex; flex-direction: column; justify-content: center;
    }
    /* On narrow widths keep the 2x2 (it is the whole point) but tighten. */
    @media (max-width: 540px) {
      .card-title { font-size: 0.92rem; }
      .meter .m-label { width: 2.6rem; font-size: 0.64rem; }
      .meter svg { width: 14px; height: 18px; }
    }
  </style>
</head>
<body>
  <script>
    const _qp = new URLSearchParams(location.search);
    if (_qp.get('embed') === 'storymap') document.body.setAttribute('data-embed', 'storymap');
  </script>
  <div class="viz-page">
    <div class="matrix" id="matrix" aria-label="Four local contexts defined by freshwater stress and net food trade position"></div>

    <p class="footer-note">
      Source: <em>Nourish and Flourish</em>, World Bank 2026, Figure 3.1. Two factors - freshwater stress and net food trade position - create four distinct contexts, each with different agricultural water management trade-offs. Layout matches the country scatter plot that follows.
      <a class="back-link" href="../index.html">&larr; Back to gallery</a>
    </p>
  </div>

  <script>
    // Context colors match the Panel 4 scatter plot regions exactly so the two
    // visuals are read as one system.
    const CONTEXTS = {
      c1: { accent: "#6a8aa8", num: "Context 1", title: "Water surplus and calorie deficit",
            water: 4, food: 1, foot: "Water-secure food importers - room to grow more food sustainably." },
      c2: { accent: "#469e6e", num: "Context 2", title: "Water and calorie surplus",
            water: 4, food: 4, foot: "Water-secure food exporters - protect the resource base while producing." },
      c3: { accent: "#c46b3b", num: "Context 3", title: "Water deficit and calorie surplus",
            water: 1, food: 4, foot: "Water-stressed food exporters - sustain output under tightening water limits." },
      c4: { accent: "#ad323c", num: "Context 4", title: "Water and calorie deficit",
            water: 1, food: 1, foot: "Water-stressed food importers - the tightest trade-offs of all." },
    };
    const TOTAL = 4; // slots per meter

    // Teardrop (water) and wheat (food) glyphs, tinted when "filled".
    function dropSVG(filled) {
      const cls = filled ? "" : ' class="glyph-empty"';
      const fill = filled ? "#2f8fc4" : "#9aa7af";
      return `<svg${cls} viewBox="0 0 17 22" aria-hidden="true"><path d="M8.5 1 C3 9 2 13 2 15 a6.5 6.5 0 0 0 13 0 c0 -2 -1 -6 -6.5 -14 Z" fill="${fill}"/></svg>`;
    }
    function wheatSVG(filled) {
      const cls = filled ? "" : ' class="glyph-empty"';
      const c = filled ? "#3f7d63" : "#9aa7af";
      // Wheat stalk: central stem + a top grain and three pairs of grains.
      return `<svg${cls} viewBox="0 0 19 24" aria-hidden="true"><g fill="${c}">`
        + `<rect x="8.2" y="9" width="1.6" height="13.5" rx="0.8"/>`
        + `<ellipse cx="9" cy="3.2" rx="2" ry="3"/>`
        + `<path d="M9 8 C5.2 6.8 3.2 8.6 3 12 C6.8 12 8.8 10.6 9 8 Z"/>`
        + `<path d="M9 8 C12.8 6.8 14.8 8.6 15 12 C11.2 12 9.2 10.6 9 8 Z"/>`
        + `<path d="M9 12.5 C5.6 11.4 3.8 13 3.6 16 C7 16 8.8 14.8 9 12.5 Z"/>`
        + `<path d="M9 12.5 C12.4 11.4 14.2 13 14.4 16 C11 16 9.2 14.8 9 12.5 Z"/>`
        + `</g></svg>`;
    }
    function meter(label, n, glyphFn) {
      let g = "";
      for (let i = 0; i < TOTAL; i++) g += glyphFn(i < n);
      return `<div class="meter"><span class="m-label">${label}</span><span class="glyphs">${g}</span></div>`;
    }

    const matrix = document.getElementById("matrix");
    // Axis labels (match the scatter: stress low->high left->right; trade
    // importer top -> exporter bottom).
    matrix.insertAdjacentHTML("beforeend",
      `<div class="axis-x low">Low freshwater stress</div>` +
      `<div class="axis-x high">High freshwater stress</div>` +
      `<div class="axis-y imp">Net food importer</div>` +
      `<div class="axis-y exp">Net food exporter</div>`);

    for (const key of ["c1", "c4", "c2", "c3"]) {
      const c = CONTEXTS[key];
      matrix.insertAdjacentHTML("beforeend",
        `<div class="card ${key}" style="--accent:${c.accent}">` +
          `<p class="card-num">${c.num}</p>` +
          `<p class="card-title">${c.title}</p>` +
          meter("Water", c.water, dropSVG) +
          meter("Food", c.food, wheatSVG) +
          `<p class="card-foot">${c.foot}</p>` +
        `</div>`);
    }
  </script>
</body>
</html>
