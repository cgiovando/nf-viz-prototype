<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Three shifts to feed the future - Nourish and Flourish</title>
  <link rel="stylesheet" href="../assets/styles.css" />
  <style>
    body { background: #fff; }
    .viz-page { padding: 1rem 1.1rem; max-width: 720px; margin: 0 auto; }

    /* Single column of stacked shift cards. Designed for the ~1/3 sidecar
       panel: each card carries a short lead by default, then three
       independently expandable reveals (problem / shift / in practice). */
    .cards { display: flex; flex-direction: column; gap: 0.85rem; margin: 0.3rem 0 0.6rem; }

    .card {
      background: #fff;
      border: 1px solid var(--c-border);
      border-radius: 14px;
      padding: 1rem 1.05rem 1.1rem;
      position: relative;
      box-shadow: 0 2px 10px rgba(15, 79, 120, 0.06);
      min-width: 0;
      overflow: hidden;
    }
    .card::before {
      content: ""; position: absolute; top: 0; left: 0;
      width: 100%; height: 5px; background: var(--accent);
    }

    .card-num {
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--c-muted); margin: 0 0 0.3rem; font-weight: 700;
      font-family: "Open Sans", system-ui, sans-serif;
    }
    .card-title {
      font-size: 1.22rem; font-weight: 700; margin: 0 0 0.4rem;
      color: var(--c-text); line-height: 1.22;
    }
    .card-lead {
      font-size: 1rem; font-style: italic; margin: 0 0 0.7rem;
      line-height: 1.4; color: var(--accent-dark);
    }

    /* Reveal list - three rows per card */
    .reveals { display: flex; flex-direction: column; gap: 0.45rem; }
    .reveal { border-top: 1px solid var(--c-border); padding-top: 0.45rem; }
    .reveal-btn {
      display: flex; align-items: center; gap: 0.55rem; width: 100%;
      border: none; background: none; cursor: pointer; padding: 0.1rem 0;
      text-align: left;
      font-family: "Open Sans", system-ui, sans-serif;
      font-size: 0.92rem; font-weight: 700; letter-spacing: 0.01em;
      color: var(--c-text);
    }
    .reveal-btn .plus {
      width: 24px; height: 24px; border-radius: 50%; flex: none;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 1.1rem; font-weight: 700; line-height: 1;
      background: var(--accent);
    }
    .reveal-btn .rl { flex: 1; }
    .reveal-btn .hint {
      font-size: 0.74rem; font-weight: 600; color: var(--c-muted);
      letter-spacing: 0.02em;
    }
    .reveal[data-open="true"] .hint { opacity: 0; }

    .reveal-body {
      font-size: 0.92rem; line-height: 1.55; color: var(--c-text);
      max-height: 0; opacity: 0; overflow: hidden; margin: 0;
      transition: max-height 0.45s ease, opacity 0.3s ease, margin 0.3s ease;
    }
    .reveal[data-open="true"] .reveal-body {
      max-height: 1400px; opacity: 1; margin: 0.5rem 0 0.1rem;
    }
    .reveal-body p { margin: 0 0 0.6rem; }
    .reveal-body p:last-child { margin-bottom: 0; }
    .reveal-body ul { margin: 0.3rem 0 0.6rem; padding-left: 1.1rem; }
    .reveal-body li { margin: 0 0 0.35rem; }
    .reveal-body .ex { display: block; margin: 0 0 0.5rem; }
    .reveal-body .ex:last-child { margin-bottom: 0; }
    .reveal-body .ex b { color: var(--accent-dark); }

    .footer-note {
      font-size: 0.76rem; color: var(--c-muted);
      margin-top: 0.7rem; padding-top: 0.55rem;
      border-top: 1px solid var(--c-border); line-height: 1.4;
    }
    body[data-embed="storymap"] .back-link { display: none; }
    body[data-embed="storymap"] { margin: 0; }
    body[data-embed="storymap"] .viz-page { box-sizing: border-box; }
  </style>
</head>
<body>
  <script>
    const _qp = new URLSearchParams(location.search);
    if (_qp.get('embed') === 'storymap') document.body.setAttribute('data-embed', 'storymap');
  </script>

  <script>
    /* =====================================================================
       ALL DISPLAY COPY lives in this single DATA object so the text can be
       swapped in one place after author sign-off, without touching markup
       or logic. Each shift has: num, title, lead, accent colors, and three
       reveals keyed problem / shift / practice. A reveal value may be a
       plain string, an array of strings (paragraphs), or an object with
       { intro, bullets } / { examples } for richer structure.
       NO em-dashes or en-dashes anywhere - plain hyphens only.
       ===================================================================== */
    const DATA = {
      footer: "Source: <em>Nourish and Flourish</em>, World Bank 2026. Three foundational shifts in agricultural water management.",
      shifts: [
        {
          num: "Shift 1",
          title: "Plan Around Water Realities",
          lead: "Align agricultural decisions with local water conditions.",
          accent: "#469e6e", accentDark: "#1f6c45",
          reveals: {
            problem: [
              "Agricultural water policy has historically been driven by production targets: how much food a country needs to grow, and how much irrigation infrastructure it needs to get there.",
              "That approach is no longer adequate. In water-stressed settings, continuing to expand irrigation without accounting for basin-level limits depletes aquifers, degrades ecosystems, and ultimately undermines the agricultural productivity it was meant to support. In water-secure settings, the inverse problem applies: available freshwater resources remain underutilized, leaving food production potential and economic opportunity unrealized."
            ],
            shift: [
              "Effective planning asks not just how much food needs to be produced, but what water resources can sustainably support, and what combination of domestic production and trade best serves long-term food security, jobs, and economic development."
            ],
            practice: {
              intro: "Depending on context, that means:",
              bullets: [
                "Expanding irrigation where water resources remain underutilized",
                "Improving productivity on existing systems where expansion is constrained",
                "Shifting toward less water-intensive crops",
                "Relying more strategically on trade to relieve pressure on scarce resources"
              ],
              after: "The water-food nexus framework provides the analytical starting point for making those distinctions and for moving beyond one-size-fits-all approaches toward strategies grounded in each country's actual water and food realities."
            }
          }
        },
        {
          num: "Shift 2",
          title: "Treat Irrigation as a Service",
          lead: "Long-term performance depends on reliable delivery, not infrastructure alone.",
          accent: "#1a73a7", accentDark: "#0f4f78",
          reveals: {
            problem: [
              "Most irrigation investment flows toward construction. Dams and canals get built, infrastructure gets handed over, but who operates it, how it gets maintained, and how costs are recovered is not elaborated until later. Systems that perform well at commissioning deteriorate steadily afterward, unable to deliver the reliable water access farmers need to invest and produce.",
              "Irrigation infrastructure fails to deliver on its long-term promise because it was not connected to the broader development goals it was meant to serve: more food, better incomes, stronger rural economies. Responsibility for actually delivering water, as distinct from building the means to deliver it, was left undefined. And without clear regulation setting standards for user charges and fees, cost recovery and the long-term financial sustainability of irrigation service received limited attention."
            ],
            shift: [
              "Treating irrigation as a service means governments setting clear rules for what irrigation providers are expected to deliver, how performance will be measured, and how operating costs will be recovered over time. When those conditions are in place, the system becomes financially sustainable, and attractive to private investment.",
              "Farmers who receive reliable water access invest in their farms. That investment generates demand for equipment, storage, processing, and markets, drawing in private businesses and capital that public investment alone cannot mobilize."
            ],
            practice: {
              examples: [
                { place: "Georgia", text: "A regulatory framework introduced performance-based tariffs tied to full operation and maintenance cost recovery, creating incentives for water user organizations and improving service reliability." },
                { place: "India (Maharashtra)", text: "An independent regulatory authority set transparent bulk water tariffs across irrigation, domestic, and industrial uses, making cost recovery an explicit part of the system's financial structure." },
                { place: "Mali", text: "A formal service contract at the Office du Niger made water delivery obligations and fee structures explicit, shifting the focus from infrastructure delivery to sustained service quality through shared accountability between government, the irrigation agency, and farmers." },
                { place: "Uganda", text: "A farmer co-investment model combined public subsidies with farmer contributions to finance 4,733 irrigation installations, mobilizing nearly 30 percent of total costs from private sources." }
              ]
            }
          }
        },
        {
          num: "Shift 3",
          title: "Use Better Data to Guide Decisions",
          lead: "Use data to make trade-offs visible - and manageable.",
          accent: "#c46b3b", accentDark: "#8c4623",
          reveals: {
            problem: [
              "Decisions about agricultural water management - where to invest, how much water is available, whether a system is performing - have historically been made with incomplete, outdated, or fragmented information. Data on water availability, infrastructure performance, and environmental impacts are often held by different agencies, collected inconsistently, and rarely shared. This makes it difficult for governments to justify investment priorities, demonstrate value for money, or course-correct when systems underperform.",
              "Without reliable data, it is harder for governments to justify investment priorities, demonstrate value for money, or ensure that decisions reflect the needs of the communities they serve."
            ],
            shift: [
              "Better data improves technical decisions and expands participation in making them. When farmers, irrigation operators, and policymakers are looking at the same information about water use, system performance, and productivity, accountability follows at every level. Investments can be targeted where they deliver the greatest returns. Water use can be monitored against sustainable limits. And when conditions change, as they increasingly will under climate pressure, systems can better adapt.",
              "The tools to make this possible are increasingly accessible and affordable: satellite imagery, remote sensing, evapotranspiration-based monitoring, and digital advisory platforms that can reach individual farmers. The barrier is less technology than the institutional commitment to collect data systematically, make it publicly accessible, and use it to drive decisions."
            ],
            practice: {
              examples: [
                { place: "China", text: "A multi-decade shift toward evapotranspiration-based water management used remote sensing to establish sustainable water use caps at the basin level, enabling crop pattern adjustments and measurable water savings within ecological limits." },
                { place: "Uganda", text: "The IrriTrack app linked farmer registration, technical advisories, equipment tracking, and farm visits to a national management information system, supporting accountability and service delivery across more than 1,975 trained local staff." },
                { place: "Burundi", text: "Remote sensing and field data were used to assess irrigation potential across different system types, helping prioritize rehabilitation versus new development and clarifying where scarce public resources would deliver the most impact." }
              ]
            }
          }
        }
      ],
      revealLabels: { problem: "The problem", shift: "The shift", practice: "In practice" }
    };
  </script>

  <div class="viz-page">
    <div class="cards" id="cards"></div>
    <p class="footer-note">
      <span id="footer"></span>
      <a class="back-link" href="../index.html">&larr; Back to gallery</a>
    </p>
  </div>

  <script>
    // Render the reveal body from a flexible value (string | array | object).
    function renderBody(val) {
      if (typeof val === "string") return `<p>${val}</p>`;
      if (Array.isArray(val)) return val.map(p => `<p>${p}</p>`).join("");
      let html = "";
      if (val.intro) html += `<p>${val.intro}</p>`;
      if (val.bullets) html += `<ul>${val.bullets.map(b => `<li>${b}</li>`).join("")}</ul>`;
      if (val.examples) html += val.examples.map(e => `<span class="ex"><b>${e.place}.</b> ${e.text}</span>`).join("");
      if (val.after) html += `<p>${val.after}</p>`;
      return html;
    }

    const cards = document.getElementById("cards");
    DATA.shifts.forEach((s) => {
      const rev = Object.keys(DATA.revealLabels).map((k) => `
        <div class="reveal" data-open="false">
          <button class="reveal-btn" aria-expanded="false">
            <span class="plus" aria-hidden="true">+</span>
            <span class="rl">${DATA.revealLabels[k]}</span>
            <span class="hint">Read more</span>
          </button>
          <div class="reveal-body">${renderBody(s.reveals[k])}</div>
        </div>`).join("");

      cards.insertAdjacentHTML("beforeend", `
        <div class="card" style="--accent:${s.accent};--accent-dark:${s.accentDark}">
          <p class="card-num">${s.num}</p>
          <p class="card-title">${s.title}</p>
          <p class="card-lead">${s.lead}</p>
          <div class="reveals">${rev}</div>
        </div>`);
    });

    document.getElementById("footer").innerHTML = DATA.footer;

    document.querySelectorAll(".reveal").forEach((r) => {
      const btn = r.querySelector(".reveal-btn");
      const plus = r.querySelector(".plus");
      btn.addEventListener("click", () => {
        const open = r.getAttribute("data-open") === "true";
        r.setAttribute("data-open", open ? "false" : "true");
        btn.setAttribute("aria-expanded", open ? "false" : "true");
        plus.textContent = open ? "+" : "-"; // plain hyphen when open
      });
    });
  </script>
</body>
</html>
