<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Agricultural production and water stress - Nourish and Flourish</title>
  <link rel="stylesheet" href="../assets/styles.css" />
  <style>
    html, body { height: 100%; }
    body { background: #eef2f5; }
    .viz-page { padding: 0; margin: 0; }

    /* Full-bleed map fills the whole media pane. */
    .map-stage {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 360px;
      overflow: hidden;
      background: #eaeef1;
    }
    #map { position: absolute; inset: 0; width: 100%; height: 100%; }
    #map svg { display: block; width: 100%; height: 100%; cursor: grab; background: #dde6ec; }
    #map svg:active { cursor: grabbing; }

    .country-tip {
      position: absolute;
      pointer-events: none;
      background: rgba(0, 38, 37, 0.94);
      color: #fff;
      padding: 0.5rem 0.7rem;
      border-radius: 7px;
      font-size: 0.8rem;
      line-height: 1.4;
      max-width: 240px;
      transform: translate(10px, -50%);
      opacity: 0;
      transition: opacity 0.12s;
      z-index: 30;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }
    .country-tip.show { opacity: 1; }
    .country-tip strong { display: block; font-size: 0.9rem; margin-bottom: 0.25rem; }
    .country-tip dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 0.12rem 0.7rem; }
    .country-tip dt { color: rgba(255,255,255,0.65); margin: 0; }
    .country-tip dd { margin: 0; font-weight: 600; }
    .country-tip .stressed-flag {
      display: inline-block; margin-top: 0.3rem; padding: 0.08rem 0.4rem;
      border-radius: 3px; background: rgba(173, 50, 60, 0.8); color: #fff;
      font-size: 0.7rem; font-weight: 600;
    }

    /* Zoom controls */
    .zoom-ctl {
      position: absolute; top: 14px; left: 14px; z-index: 20;
      display: flex; flex-direction: column;
      border-radius: 8px; overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    }
    .zoom-ctl button {
      width: 34px; height: 34px; border: none; background: #fff;
      font-size: 1.2rem; line-height: 1; color: var(--c-text); cursor: pointer;
      font-family: "Open Sans", system-ui, sans-serif;
    }
    .zoom-ctl button + button { border-top: 1px solid #e2e7eb; }
    .zoom-ctl button:hover { background: #f1f5f8; }

    /* Minimizable legend popup */
    .legend-pop {
      position: absolute; right: 14px; bottom: 14px; z-index: 20;
      background: rgba(255,255,255,0.96);
      border: 1px solid #d8dee5; border-radius: 10px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.14);
      width: 246px; max-width: calc(100% - 28px);
      backdrop-filter: blur(3px);
    }
    .legend-pop .lp-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.5rem 0.7rem; cursor: pointer; user-select: none;
    }
    .legend-pop .lp-head h3 {
      margin: 0; font-size: 0.74rem; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--c-muted); font-weight: 700;
      font-family: "Open Sans", system-ui, sans-serif;
    }
    .legend-pop .lp-toggle {
      border: none; background: none; cursor: pointer; color: var(--c-muted);
      font-size: 1rem; line-height: 1; padding: 0 0.1rem;
    }
    .legend-pop .lp-body { padding: 0 0.7rem 0.7rem; }
    .legend-pop[data-collapsed="true"] .lp-body { display: none; }
    .legend-pop[data-collapsed="true"] { width: auto; }

    .scale-bar { display: flex; height: 13px; border-radius: 3px; overflow: hidden; border: 1px solid #d8dee5; }
    .scale-bar div { flex: 1; }
    .scale-labels { display: flex; justify-content: space-between; font-size: 0.68rem; color: var(--c-muted); margin-top: 0.25rem; }
    .lp-sub { font-size: 0.68rem; color: var(--c-muted); margin: 0.55rem 0 0.3rem; font-weight: 600; }
    .stripe-key { display: flex; align-items: center; gap: 0.45rem; font-size: 0.74rem; color: var(--c-text); }
    .stripe-swatch {
      width: 28px; height: 16px; flex: none; border: 1px solid #d8dee5; border-radius: 3px;
      background-color: #6aae62;
      background-image: repeating-linear-gradient(45deg,
        rgba(173,50,60,0) 0, rgba(173,50,60,0) 3px,
        rgba(173,50,60,0.7) 3px, rgba(173,50,60,0.7) 5px);
    }
    .lp-source { font-size: 0.64rem; color: var(--c-muted); margin: 0.55rem 0 0; line-height: 1.35; }
    .lp-source a { color: var(--c-accent-dark); }
    body[data-embed="storymap"] .back-link { display: none; }
  </style>
</head>
<body>
  <script>
    const _qp = new URLSearchParams(location.search);
    if (_qp.get('embed') === 'storymap') document.body.setAttribute('data-embed', 'storymap');
  </script>
  <div class="viz-page">
    <div class="map-stage">
      <div id="map"></div>
      <div class="country-tip" id="tip"></div>

      <div class="zoom-ctl">
        <button id="zoom-in" aria-label="Zoom in">+</button>
        <button id="zoom-out" aria-label="Zoom out">&minus;</button>
        <button id="zoom-reset" aria-label="Reset view" style="font-size:0.85rem;">&#8634;</button>
      </div>

      <div class="legend-pop" id="legend" data-collapsed="false">
        <div class="lp-head" id="legend-head">
          <h3>Legend</h3>
          <button class="lp-toggle" id="legend-toggle" aria-label="Minimize legend">&minus;</button>
        </div>
        <div class="lp-body">
          <p class="lp-sub">Agricultural production (billion kcal / year)</p>
          <div class="scale-bar" id="scale-bar"></div>
          <div class="scale-labels"><span>100</span><span>1k</span><span>10k</span><span>100k</span><span>&ge; 1M</span></div>
          <p class="lp-sub">Water stress</p>
          <div class="stripe-key">
            <span class="stripe-swatch"></span>
            <span>Hatched = high water stress (&ge; 40% of freshwater withdrawn)</span>
          </div>
          <p class="lp-source">
            Sources: FAOSTAT food balance sheets 2019; WRI Aqueduct 3.0 baseline water stress. <em>Nourish and Flourish</em>, World Bank 2026.
            <a class="back-link" href="../index.html">Back to gallery</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
    import * as topojson from "https://cdn.jsdelivr.net/npm/topojson-client@3/+esm";

    const data = await fetch("../data/dashboard.json").then(r => r.json());
    const world = await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(r => r.json());

    function cleanM49(v) {
      if (v == null) return null;
      return String(v).replace(/[^0-9]/g, "").padStart(3, "0");
    }
    const byM49 = new Map();
    for (const r of data) {
      const code = cleanM49(r.m49);
      if (code) byM49.set(code, r);
    }

    const countries = topojson.feature(world, world.objects.countries);
    const STRESS_THRESHOLD = 40;

    const prodScale = d3.scaleSequentialLog()
      .domain([100, 1_000_000])
      .interpolator(d3.interpolateYlGn)
      .clamp(true);

    // Legend scale bar
    const sb = document.getElementById("scale-bar");
    const stops = 12;
    sb.innerHTML = "";
    for (let i = 0; i < stops; i++) {
      const v = Math.pow(10, 2 + (i / (stops - 1)) * 4);
      const div = document.createElement("div");
      div.style.background = prodScale(v);
      sb.appendChild(div);
    }

    const el = document.getElementById("map");
    let svg, g, projection, path, zoom;

    function build() {
      const width = el.clientWidth;
      const height = el.clientHeight;
      el.innerHTML = "";

      // Center on inhabited latitudes: clip the projection so Antarctica and the
      // high Arctic are trimmed from the default view.
      projection = d3.geoNaturalEarth1();
      // Fit to a clipped sphere (roughly -56 to +84 latitude band).
      const clipBand = {
        type: "Polygon",
        coordinates: [[[-180, 84], [180, 84], [180, -56], [-180, -56], [-180, 84]]],
      };
      projection.fitExtent([[6, 6], [width - 6, height - 6]], clipBand);
      path = d3.geoPath(projection);

      svg = d3.select(el).append("svg")
        .attr("viewBox", `0 0 ${width} ${height}`)
        .attr("width", width).attr("height", height);

      const defs = svg.append("defs");
      defs.append("pattern")
        .attr("id", "stress-hatch").attr("width", 5).attr("height", 5)
        .attr("patternUnits", "userSpaceOnUse").attr("patternTransform", "rotate(45)")
        .append("rect").attr("width", 2.4).attr("height", 5)
        .attr("fill", "#ad323c").attr("fill-opacity", 0.7);

      g = svg.append("g");

      g.selectAll("path.country")
        .data(countries.features)
        .join("path")
        .attr("class", "country")
        .attr("d", path)
        .attr("fill", d => {
          const r = byM49.get(String(d.id).padStart(3, "0"));
          const v = r?.production_bkcal;
          return v != null && v > 0 ? prodScale(v) : "#cdd6dd";
        })
        .attr("stroke", "#fff").attr("stroke-width", 0.4)
        .style("cursor", "pointer")
        .on("pointerenter", function (event, d) {
          d3.select(this).attr("stroke", "#002625").attr("stroke-width", 1.2).raise();
          showTip(event, d);
        })
        .on("pointermove", showTip)
        .on("pointerleave", function () {
          d3.select(this).attr("stroke", "#fff").attr("stroke-width", 0.4);
          hideTip();
        });

      // Water-stress overlay (always on; no case-study markers here)
      g.append("g").selectAll("path")
        .data(countries.features.filter(d => {
          const r = byM49.get(String(d.id).padStart(3, "0"));
          return r && r.water_stress_baseline != null && r.water_stress_baseline >= STRESS_THRESHOLD;
        }))
        .join("path")
        .attr("d", path)
        .attr("fill", "url(#stress-hatch)").attr("stroke", "none")
        .style("pointer-events", "none");

      // Zoom + pan
      zoom = d3.zoom()
        .scaleExtent([1, 8])
        .translateExtent([[0, 0], [width, height]])
        .on("zoom", (event) => g.attr("transform", event.transform));
      svg.call(zoom);
    }

    function fmtProd(v) {
      if (v == null) return "n/a";
      if (v >= 1e6) return (v / 1e6).toFixed(2) + "M";
      if (v >= 1e3) return (v / 1e3).toFixed(1) + "k";
      return v.toFixed(0);
    }
    function showTip(event, d) {
      const tip = document.getElementById("tip");
      const r = byM49.get(String(d.id).padStart(3, "0"));
      const stress = r?.water_stress_baseline;
      const stressed = stress != null && stress >= STRESS_THRESHOLD;
      tip.innerHTML = `
        <strong>${r?.country || d.properties?.name || "Unknown"}</strong>
        <dl>
          <dt>Production</dt><dd>${fmtProd(r?.production_bkcal)} bkcal/yr</dd>
          <dt>Water stress</dt><dd>${stress != null ? `${stress.toFixed(0)}%` : "n/a"}</dd>
        </dl>
        ${stressed ? `<span class="stressed-flag">High water stress</span>` : ""}`;
      const rect = el.getBoundingClientRect();
      tip.style.left = (event.clientX - rect.left + 12) + "px";
      tip.style.top = (event.clientY - rect.top) + "px";
      tip.classList.add("show");
    }
    function hideTip() { document.getElementById("tip").classList.remove("show"); }

    build();

    // Zoom buttons
    document.getElementById("zoom-in").addEventListener("click", () => svg.transition().duration(300).call(zoom.scaleBy, 1.6));
    document.getElementById("zoom-out").addEventListener("click", () => svg.transition().duration(300).call(zoom.scaleBy, 1 / 1.6));
    document.getElementById("zoom-reset").addEventListener("click", () => svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity));

    // Legend collapse
    const legend = document.getElementById("legend");
    function toggleLegend() {
      const collapsed = legend.getAttribute("data-collapsed") === "true";
      legend.setAttribute("data-collapsed", collapsed ? "false" : "true");
      document.getElementById("legend-toggle").innerHTML = collapsed ? "&minus;" : "+";
    }
    document.getElementById("legend-head").addEventListener("click", toggleLegend);

    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(build, 200);
    });
  </script>
</body>
</html>
