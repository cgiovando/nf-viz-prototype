<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Within planetary boundaries - Nourish and Flourish</title>
  <link rel="stylesheet" href="../assets/styles.css" />
  <style>
    body { background: #fff; }
    .viz-page { padding: 1rem; max-width: 760px; margin: 0 auto; }

    .ring-stage {
      position: relative;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      aspect-ratio: 1 / 1;
    }
    .ring-stage svg { display: block; width: 100%; height: 100%; overflow: visible; }

    /* Caption strip beneath the rings - the big numbers do the talking. */
    .ring-key {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem 1.4rem;
      margin: 0.9rem auto 0;
      max-width: 560px;
    }
    .ring-key .item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.95rem;
      color: var(--c-muted);
      min-width: 0;
    }
    .ring-key .dot {
      width: 14px; height: 14px; border-radius: 4px; flex: none;
      border: 1px solid rgba(0,0,0,0.06);
    }
    .ring-key .dot.fed { background: #3f7d63; }
    /* "Beyond current sustainable limits" swatch = red base with darker hatch. */
    .ring-key .dot.over {
      background-color: #cf5a55;
      background-image: repeating-linear-gradient(45deg,
        rgba(122,34,39,0) 0, rgba(122,34,39,0) 3px,
        rgba(122,34,39,0.55) 3px, rgba(122,34,39,0.55) 5px);
    }
    .ring-key .dot.future { background: #cf5a55; }
    .ring-key strong { color: var(--c-text); font-weight: 700; }

    .footer-note {
      font-size: 0.74rem;
      color: var(--c-muted);
      margin-top: 1rem;
      padding-top: 0.6rem;
      border-top: 1px solid var(--c-border);
      line-height: 1.4;
      text-align: center;
    }
    body[data-embed="storymap"] .back-link { display: none; }
    body[data-embed="storymap"] { margin: 0; }
    /* ?compact=1 drops the min-height (used to generate compact PNGs for the
       narrative-panel placement; without compact, the page fills the docked
       pane vertically). */
    body[data-compact="1"][data-embed="storymap"] .viz-page {
      min-height: 0; padding-top: 0.4rem; padding-bottom: 0.4rem;
    }
    body[data-embed="storymap"] .viz-page {
      min-height: 100vh; box-sizing: border-box;
      display: flex; flex-direction: column; justify-content: center;
    }

    /* SVG number typography */
    .n-big { font-family: "Open Sans", system-ui, sans-serif; font-weight: 800; }
    .n-sub { font-family: "Open Sans", system-ui, sans-serif; font-weight: 700;
             letter-spacing: 0.08em; text-transform: uppercase; }
  </style>
</head>
<body>
  <script>
    const _qp = new URLSearchParams(location.search);
    if (_qp.get('embed') === 'storymap') document.body.setAttribute('data-embed', 'storymap');
    if (_qp.get('compact') === '1') document.body.setAttribute('data-compact', '1');
    if (_qp.get('layout') === 'right') document.body.setAttribute('data-layout', 'right');
  </script>
  <div class="viz-page">
    <div class="ring-stage">
      <svg id="rings" viewBox="0 0 520 520" role="img"
           aria-label="Concentric rings: today's food systems sustainably support only about half of the current world population. The full current population, and the 10 billion projected by 2050, both fall beyond sustainable limits.">
      </svg>
    </div>

    <div class="ring-key">
      <span class="item"><span class="dot fed"></span>Half of today's population&nbsp;&mdash;&nbsp;<strong>fed sustainably</strong></span>
      <span class="item"><span class="dot over"></span>beyond sustainable limits</span>
    </div>

    <p class="footer-note">
      Source: <em>Nourish and Flourish</em>, World Bank 2026.
      <a class="back-link" href="../index.html">&larr; Back to gallery</a>
    </p>
  </div>

  <script>
    // ---- Three concentric rings -----------------------------------------
    // Natasha's spec (2026-05-29): inner disc = half of today's population,
    // fed sustainably (green); the full current population and the ~10B
    // projected for 2050 both lie beyond sustainable limits (red + hatch).
    // Nesting: green core (half today) -> today's full population band ->
    // 2050 projection band. Radii tuned so inner area is ~half the today
    // disc (the key "only half" message) while leaving room to label bands.
    const SVG_NS = "http://www.w3.org/2000/svg";
    const svg = document.getElementById("rings");
    const cx = 260, cy = 260;

    // Radii (px). Inner is ~half the AREA of the today disc (116^2/168^2≈0.48).
    const rFuture = 210;   // ~10B projected for 2050
    const rToday  = 168;   // current world population
    const rFed    = 116;   // half of today's population, fed sustainably

    function el(name, attrs) {
      const n = document.createElementNS(SVG_NS, name);
      for (const k in attrs) n.setAttribute(k, attrs[k]);
      return n;
    }

    // Hatch pattern for the "beyond sustainable limits" zone. Translucent
    // stripes so the red base below shows through.
    const defs = el("defs", {});
    const pat = el("pattern", { id: "overshoot", width: 7, height: 7,
      patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" });
    pat.appendChild(el("rect", { width: 7, height: 7, fill: "transparent" }));
    pat.appendChild(el("rect", { width: 3, height: 7, fill: "#7a2227", "fill-opacity": 0.5 }));
    defs.appendChild(pat);
    // soft drop shadow
    const filt = el("filter", { id: "soft", x: "-20%", y: "-20%", width: "140%", height: "140%" });
    filt.appendChild(el("feDropShadow", { dx: 0, dy: 4, stdDeviation: 8,
      "flood-color": "#0f4f78", "flood-opacity": 0.12 }));
    defs.appendChild(filt);
    svg.appendChild(defs);

    // 1. 2050 projection disc (~10B) - lighter red, the outermost (and most
    //    over-extended) band, drawn first so inner discs sit on top.
    svg.appendChild(el("circle", { cx, cy, r: rFuture, fill: "#e07f7a",
      filter: "url(#soft)" }));

    // 2. Current population disc - full red. Shows only in the band between
    //    the today radius and the 2050 radius once inner discs are stacked.
    svg.appendChild(el("circle", { cx, cy, r: rToday, fill: "#cf5a55" }));

    // 3. Hatch overlay across the whole "beyond limits" area (both red bands).
    svg.appendChild(el("circle", { cx, cy, r: rFuture, fill: "url(#overshoot)" }));

    // 4. Half of today's population, fed sustainably - solid green core.
    svg.appendChild(el("circle", { cx, cy, r: rFed, fill: "#3f7d63" }));

    // ---- Labels ----------------------------------------------------------
    // Green core: "1/2" hero with "fed sustainably" beneath.
    const fed = el("text", { x: cx, y: cy + 4, "text-anchor": "middle", fill: "#fff" });
    fed.appendChild(Object.assign(el("tspan", { class: "n-big", "font-size": 46 }), { textContent: "½" }));
    svg.appendChild(fed);
    const fedSub = el("text", { x: cx, y: cy + 26, "text-anchor": "middle",
      fill: "#fff", class: "n-sub", "font-size": 10, "fill-opacity": 0.92 });
    fedSub.textContent = "FED SUSTAINABLY";
    svg.appendChild(fedSub);

    // Current-population band label (top of the today band, above the core).
    const today = el("text", { x: cx, y: cy - rFed - 16, "text-anchor": "middle",
      fill: "#fff" });
    today.appendChild(Object.assign(el("tspan", { class: "n-sub", "font-size": 11,
      "fill-opacity": 0.95 }), { textContent: "TODAY'S POPULATION" }));
    svg.appendChild(today);

    // 2050 projection band label, near the top of the outer band.
    const ten = el("text", { x: cx, y: cy - rToday - 8, "text-anchor": "middle", fill: "#fff" });
    ten.appendChild(Object.assign(el("tspan", { class: "n-sub", "font-size": 11,
      "fill-opacity": 0.95 }), { textContent: "BY 2050" }));
    svg.appendChild(ten);

    // ---- Gentle grow-in animation (respects reduced-motion) --------------
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!reduce) {
      const grows = svg.querySelectorAll("circle");
      grows.forEach((c, i) => {
        c.style.transformBox = "fill-box";
        c.style.transformOrigin = "center";
        c.style.transform = "scale(0.001)";
        c.style.transition = "transform 700ms cubic-bezier(0.2,0.8,0.2,1)";
        setTimeout(() => { c.style.transform = "scale(1)"; }, 120 + i * 130);
      });
      svg.querySelectorAll("text").forEach((t) => {
        t.style.opacity = "0";
        t.style.transition = "opacity 500ms ease";
        setTimeout(() => { t.style.opacity = "1"; }, 800);
      });
    }
  </script>
</body>
</html>
