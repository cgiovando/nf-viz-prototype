<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Image frame</title>
  <style>
    /* Generic, content-free responsive image viewer. Loads an image by URL
       (?src=) and shows it object-fit:contain, centered, never cropped or
       overflowing - intended for embedding wide infographics in a docked
       StoryMap pane without the default cover-crop. */
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
    .frame {
      width: 100%; min-height: 100%;
      display: flex; align-items: center; justify-content: center;
      padding: 0; overflow: hidden;
    }
    .frame img {
      display: block;
      max-width: 100%;
      max-height: 100vh;
      width: auto; height: auto;
      object-fit: contain;
    }
    .msg {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 0.85rem; color: #5a6a78; padding: 1rem; text-align: center;
    }
    body[data-embed="storymap"] .frame { min-height: 100vh; }
  </style>
</head>
<body>
  <script>
    const _qp = new URLSearchParams(location.search);
    if (_qp.get('embed') === 'storymap') document.body.setAttribute('data-embed', 'storymap');
  </script>
  <div class="frame" id="frame"></div>
  <script>
    (function () {
      const frame = document.getElementById("frame");
      const raw = new URLSearchParams(location.search).get("src");
      if (!raw) {
        frame.innerHTML = '<p class="msg">No image specified. Pass an image URL via ?src=</p>';
        return;
      }
      let url;
      try { url = decodeURIComponent(raw); } catch (e) { url = raw; }
      const img = document.createElement("img");
      img.alt = "";
      img.referrerPolicy = "no-referrer";
      img.onerror = function () {
        frame.innerHTML = '<p class="msg">Image could not be loaded.</p>';
      };
      img.src = url;
      frame.appendChild(img);
    })();
  </script>
</body>
</html>
